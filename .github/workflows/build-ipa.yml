# Builds the unsigned iPhone/iPad IPA of Tears of the Kingdom on a GitHub-hosted Mac, from your own game files.
# Setup and usage: .github/BUILD-IPA.md
#
# By default the game files come from the draft release "totk-input", which .github/pc/build-ipa.ps1 fills with
# encrypted 2000 MB pieces, and the IPA leaves as an encrypted artifact that the same script downloads and decrypts.
# The password is the FILE_PASS secret, so nobody else can read either one. The game and update inputs can name an
# rclone path or a direct https:// link instead, and the output input an rclone folder.

name: Build iPhone IPA

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Leave empty to use the totk-input draft release. Or the base game 1.0.0 (XCI or NSP) as an rclone path or https:// link'
        required: false
      update:
        description: 'With game set: the update NSP or NSZ (1.4.3 is the version tested on iPhone); empty builds 1.0.0'
        required: false
      fonts:
        description: 'With game set, NSP base only: rclone folder of an unpacked firmware (.nca files) or the six .bfttf fonts'
        required: false
      output:
        description: 'Leave empty for an encrypted artifact. Or an rclone folder the IPA is uploaded to, such as "drive:Switch/ipa"'
        required: false
      mode:
        description: 'build: make the IPA. check: prepare the Mac and check disk space. transfer-test: fetch the inputs and send 200 MB back'
        type: choice
        options: [build, check, transfer-test]
        default: build
      source_ref:
        description: 'Branch, tag or commit of ly05010419/MacNativeGames to build'
        required: false
        default: main
      runner:
        description: 'macos-26 is free on a public repository; macos-26-xlarge is faster but billed'
        type: choice
        options: [macos-26, macos-26-xlarge]
        default: macos-26

permissions:
  contents: write   # reading and deleting a draft release needs write access

concurrency:
  group: build-ipa

defaults:
  run:
    shell: bash

jobs:
  ipa:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      GH_TOKEN: ${{ github.token }}
      RELEASE: totk-input
      ITER: '100000'   # PBKDF2 rounds; build-ipa.ps1 uses the same
      # Inputs reach the scripts as environment variables, never pasted into them
      IN_GAME: ${{ inputs.game }}
      IN_UPDATE: ${{ inputs.update }}
      IN_FONTS: ${{ inputs.fonts }}
      IN_OUTPUT: ${{ inputs.output }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ly05010419/MacNativeGames
          ref: ${{ inputs.source_ref }}
          path: src
          persist-credentials: false

      - name: Check inputs and secrets
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          FILE_PASS: ${{ secrets.FILE_PASS }}
        run: |
          echo "TOTK=$HOME/totk" >> "$GITHUB_ENV"
          remote() { [ -n "$1" ] && case "$1" in http://*|https://*) false ;; *) true ;; esac; }
          if [ "$MODE" = build ]; then
            [ -n "$PROD_KEYS" ] || { echo "::error::the PROD_KEYS secret is not set (build-ipa.ps1 -Keys sets it)"; exit 1; }
          fi
          if [ -z "$IN_GAME" ] || [ -z "$IN_OUTPUT" ]; then
            [ -n "$FILE_PASS" ] || { echo "::error::the FILE_PASS secret is not set (build-ipa.ps1 sets it)"; exit 1; }
          fi
          if [ -z "$IN_GAME" ] && [ "$MODE" != check ]; then
            gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx manifest.json ||
              { echo "::error::the $RELEASE draft release has no manifest.json yet: upload the game files with build-ipa.ps1"; exit 1; }
          fi
          if remote "$IN_GAME" || remote "$IN_UPDATE" || remote "$IN_FONTS" || remote "$IN_OUTPUT"; then
            [ -n "$RCLONE_CONF" ] || { echo "::error::an rclone path is used but the RCLONE_CONF secret is not set"; exit 1; }
          fi
          if [ -n "$RCLONE_CONF" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/rclone.conf"
            printf '%s\n' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
            echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        if: inputs.mode != 'transfer-test'
        run: |
          df -h /System/Volumes/Data
          # Keep only the selected Xcode; the others, the simulators and unused SDKs take most of the disk
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          echo "keeping $keep ($(xcodebuild -version | head -1))"
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] && continue
            [ "$(cd "$x" && pwd -P)" = "$keep" ] && continue
            sudo rm -rf "$x" &
          done
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl delete all >/dev/null 2>&1 || true
          xcrun simctl runtime delete all </dev/null >/dev/null 2>&1 || true
          sudo rm -rf ~/Library/Developer/CoreSimulator ~/Library/Android "${ANDROID_HOME:-/nonexistent}" ~/.dotnet \
            /usr/local/share/dotnet ~/.ghcup ~/.rustup ~/.cargo "${RUNNER_TOOL_CACHE:-/nonexistent}" &
          wait
          df -h /System/Volumes/Data

      - name: Install build tools
        run: |
          if [ "$MODE" = transfer-test ]; then
            brew install openssl@3 rclone
          else
            brew install opus libvpx python@3.14 xcodegen cmake ninja openssl@3 rclone
            # Xcode 26 ships the Metal compiler as a separate component; the iOS build compiles its startup shaders with it
            if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
              xcodebuild -downloadComponent MetalToolchain
            fi
            xcrun -sdk iphoneos metal --version | head -1
            xcrun --sdk iphoneos --show-sdk-version
            python3.14 --version
          fi
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Check disk space for the build
        run: |
          size_gb() {   # size of an input in GB, rounded up; 0 when empty
            case "$1" in
              '') echo 0 ;;
              http://*|https://*) b=$(curl -fsSLI "$1" | tr -d '\r' | awk 'tolower($1)=="content-length:"{n=$2} END{print n+0}'); echo $(( (b + 2**30 - 1) / 2**30 )) ;;
              *) b=$(rclone size --json "$1" | jq .bytes); echo $(( (b + 2**30 - 1) / 2**30 )) ;;
            esac
          }
          inputs=0
          if [ -n "$IN_GAME" ]; then
            for src in "$IN_GAME" "$IN_UPDATE" "$IN_FONTS"; do
              [ -n "$src" ] || continue
              gb=$(size_gb "$src")
              echo "input $src: $gb GB"
              inputs=$((inputs + gb))
            done
            update=$IN_UPDATE
          elif [ "$MODE" != check ]; then
            gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p manifest.json -O "$RUNNER_TEMP/manifest.json" --clobber
            jq -r '.files[] | "input \(.role): \(.name), \(.size) bytes in \(.pieces | length) pieces"' "$RUNNER_TEMP/manifest.json"
            b=$(jq '[.files[].size] | add' "$RUNNER_TEMP/manifest.json")
            inputs=$(( (b + 2**30 - 1) / 2**30 ))
            update=$(jq -r '.files[] | select(.role == "update") | .name' "$RUNNER_TEMP/manifest.json")
          else
            inputs=25; update=yes
            echo "no inputs looked at: assuming 25 GB of them, with an update"
          fi
          # build_app.py asks for 60 GB free beside a fresh base + update build (45 GB without an update); the encrypted
          # IPA needs about 18 GB more, and a release piece 2 GB while it is decrypted
          build=$([ -n "$update" ] && echo 60 || echo 45)
          free=$(df -g "$HOME" | awk 'NR==2{print $4}')
          need=$((inputs + build + 20))
          echo "free: $free GB, needed: about $need GB ($inputs GB of inputs, $build GB for the build, 20 GB for the IPA's copy)"
          if [ "$MODE" != transfer-test ] && [ "$free" -lt "$need" ]; then
            echo "::error::not enough disk space on this runner ($free GB free, about $need GB needed); try the macos-26-xlarge runner"
            exit 1
          fi

      - name: Download the game files
        if: inputs.mode != 'check'
        env:
          FILE_PASS: ${{ secrets.FILE_PASS }}
        run: |
          mkdir -p "$TOTK/in" "$TOTK/fonts" "$TOTK/out"
          stats=(--stats 1m --stats-one-line --stats-log-level NOTICE)
          if [ -z "$IN_GAME" ]; then
            # Each piece is "openssl enc -aes-256-cbc -pbkdf2 -md sha256" output of up to 2000 MB of the file; decrypting
            # them in order and appending gives the file back, checked against its SHA-256 from the manifest
            m="$RUNNER_TEMP/manifest.json"
            gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p manifest.json -O "$m" --clobber
            for i in $(seq 0 $(( $(jq '.files | length' "$m") - 1 ))); do
              role=$(jq -r ".files[$i].role" "$m"); name=$(jq -r ".files[$i].name" "$m")
              case "$role" in game|update) out="$TOTK/in/$name" ;; *) out="$RUNNER_TEMP/$name" ;; esac
              : > "$out"
              for piece in $(jq -r ".files[$i].pieces[]" "$m"); do
                gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "$piece" -D "$RUNNER_TEMP/pieces" --clobber
                "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter "$ITER" -md sha256 -pass env:FILE_PASS \
                  -in "$RUNNER_TEMP/pieces/$piece" >> "$out"
                rm "$RUNNER_TEMP/pieces/$piece"
              done
              [ "$(shasum -a 256 "$out" | cut -d' ' -f1)" = "$(jq -r ".files[$i].sha256" "$m")" ] ||
                { echo "::error::$name does not match its SHA-256 after decrypting"; exit 1; }
              echo "$role: $name ($(stat -f %z "$out") bytes, SHA-256 checked)"
              case "$role" in
                game) echo "GAME_FILE=$out" >> "$GITHUB_ENV" ;;
                update) echo "UPDATE_FILE=$out" >> "$GITHUB_ENV" ;;
                fonts) ditto -x -k "$out" "$TOTK/fonts" && rm "$out" ;;
              esac
            done
          else
            fetch() {   # fetch <source> <folder>: prints the downloaded file's path
              local name
              case "$1" in
                http://*|https://*)
                  name="${1%%\?*}"; name="${name##*/}"
                  curl -fL --retry 5 --no-progress-meter -o "$2/${name:-download}" "$1" >&2
                  ;;
                *)
                  name="${1##*/}"; name="${name#*:}"
                  rclone copy "$1" "$2" --multi-thread-streams 8 --retries 5 "${stats[@]}" >&2
                  ;;
              esac
              echo "$2/$name"
            }
            echo "GAME_FILE=$(fetch "$IN_GAME" "$TOTK/in")" >> "$GITHUB_ENV"
            [ -z "$IN_UPDATE" ] || echo "UPDATE_FILE=$(fetch "$IN_UPDATE" "$TOTK/in")" >> "$GITHUB_ENV"
            [ -z "$IN_FONTS" ] || rclone copy "$IN_FONTS" "$TOTK/fonts" --retries 5 "${stats[@]}"
          fi
          ls -l "$TOTK/in" "$TOTK/fonts"
          df -h /System/Volumes/Data

      - name: Build the IPA
        if: inputs.mode == 'build'
        working-directory: src
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          keys="$RUNNER_TEMP/prod.keys"
          install -m 600 /dev/null "$keys"
          printf '%s\n' "$PROD_KEYS" > "$keys"
          trap 'rm -f "$keys"' EXIT
          args=("$GAME_FILE" -k "$keys" --platform ios -o "$TOTK/out/TOTK.ipa" --work "$TOTK/TOTK_build" --no-shader-reminder)
          [ -z "${UPDATE_FILE:-}" ] || args+=(--update "$UPDATE_FILE")
          if compgen -G "$TOTK/fonts/*.bfttf" >/dev/null; then
            args+=(--shared-fonts "$TOTK/fonts")
          elif compgen -G "$TOTK/fonts/*.nca" >/dev/null; then
            args+=(--firmware "$TOTK/fonts")
          fi
          python3.14 -u build_app.py "${args[@]}"
          ls -l "$TOTK/out"

      - name: Make a 200 MB stand-in for the IPA
        if: inputs.mode == 'transfer-test'
        run: head -c 209715200 /dev/urandom > "$TOTK/out/TOTK.ipa"

      - name: Prepare the IPA for sending
        if: inputs.mode != 'check'
        env:
          FILE_PASS: ${{ secrets.FILE_PASS }}
        run: |
          name="TOTK-$(date -u +%Y%m%d)-run${GITHUB_RUN_NUMBER}$([ "$MODE" = build ] || echo -test).ipa"
          echo "IPA_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/send"
          shasum -a 256 "$TOTK/out/TOTK.ipa" | cut -d' ' -f1 > "$RUNNER_TEMP/send/$name.sha256"
          if [ -z "$IN_OUTPUT" ]; then
            "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter "$ITER" -md sha256 -pass env:FILE_PASS \
              -in "$TOTK/out/TOTK.ipa" -out "$RUNNER_TEMP/send/$name.enc"
            rm "$TOTK/out/TOTK.ipa"
          else
            dest="${IN_OUTPUT%/}"
            case "$dest" in *:) ;; *) dest="$dest/" ;; esac
            rclone copyto "$TOTK/out/TOTK.ipa" "$dest$name" --retries 5 --stats 1m --stats-one-line --stats-log-level NOTICE
            echo "uploaded $dest$name" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          ls -l "$RUNNER_TEMP/send"

      # Encrypted with FILE_PASS: only build-ipa.ps1 -Receive (with your password) turns it back into the IPA
      - name: Upload the encrypted IPA
        if: inputs.mode != 'check' && inputs.output == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/send/${{ env.IPA_NAME }}.enc
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Upload its SHA-256
        if: inputs.mode != 'check' && inputs.output == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/send/${{ env.IPA_NAME }}.sha256
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Summary
        if: inputs.mode != 'check' && inputs.output == ''
        run: |
          echo "The encrypted IPA is ready: on your PC, run build-ipa.ps1 -Receive to download and decrypt it." | tee -a "$GITHUB_STEP_SUMMARY"

      # Build logs may hold what hactool prints about the encrypted game files, so they never go to GitHub as they are:
      # to your storage with an output folder, otherwise encrypted like the IPA
      - name: Collect the build logs
        if: failure() && inputs.mode == 'build'
        env:
          FILE_PASS: ${{ secrets.FILE_PASS }}
        run: |
          [ -d "$TOTK/TOTK_build/logs" ] || exit 0
          df -h /System/Volumes/Data
          name="TOTK-logs-run${GITHUB_RUN_NUMBER}.tar.gz"
          tar -czf "$RUNNER_TEMP/$name" -C "$TOTK/TOTK_build" logs
          if [ -n "$IN_OUTPUT" ] && [ -n "${RCLONE_CONFIG:-}" ]; then
            dest="${IN_OUTPUT%/}"
            case "$dest" in *:) ;; *) dest="$dest/" ;; esac
            rclone copyto "$RUNNER_TEMP/$name" "$dest$name" --retries 5
            echo "build logs: $dest$name" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter "$ITER" -md sha256 -pass env:FILE_PASS \
              -in "$RUNNER_TEMP/$name" -out "$RUNNER_TEMP/$name.enc"
            echo "LOGS_FILE=$RUNNER_TEMP/$name.enc" >> "$GITHUB_ENV"
          fi

      - name: Upload the encrypted build logs
        if: failure() && inputs.mode == 'build' && env.LOGS_FILE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.LOGS_FILE }}
          archive: false
          retention-days: 7
